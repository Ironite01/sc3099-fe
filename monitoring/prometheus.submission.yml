global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "ml"
    metrics_path: /metrics
    static_configs:
      - targets: ["ml:8001"]

  - job_name: "dashboard"
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard:9101"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
